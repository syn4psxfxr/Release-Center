name: Update Copilot data

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch: {}      # "Run workflow" button for an on-demand refresh
  issues:                    # keep readiness tasks in sync
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-data.yml']

permissions:
  contents: write
  issues: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Roadmap + Message Center
        run: node scripts/fetch-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Copilot data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
