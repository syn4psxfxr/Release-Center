<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copilot Release Center</title>
  <meta name="description" content="What's coming to Microsoft 365 Copilot: upcoming releases from the official Roadmap and the Message Center, so your organization can prepare.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b5fc7'/><path d='M9 21l5-10 4 7 2-3 3 6' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <p class="eyebrow">Microsoft 365 Copilot</p>
        <h1>What's coming</h1>
      </div>
      <div class="actions">
        <span id="lastUpdate" class="muted small"></span>
        <button id="btnCheck" class="icon-btn" type="button" aria-label="Check for updates" title="Check for updates">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btnTheme" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <section class="summary" id="summary" aria-label="At a glance"></section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <div class="controls">
      <div class="seg" role="tablist" aria-label="View">
        <button role="tab" data-view="upcoming" class="active">Upcoming</button>
        <button role="tab" data-view="admin">Admin Center</button>
        <button role="tab" data-view="urgent">Urgent <span class="badge" id="urgentCount"></span></button>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="Search" aria-label="Search">
        <select id="fSource" aria-label="Source">
          <option value="">All sources</option>
          <option value="rm">Roadmap</option>
          <option value="mc">Message Center</option>
        </select>
      </div>
    </div>

    <nav class="chips" id="chips" aria-label="Themes"></nav>

    <section id="list" class="list"></section>
    <div class="more-wrap"><button id="btnMore" class="text-btn" type="button" hidden>Show more</button></div>

    <footer class="foot muted small">
      Sources: <a href="https://www.microsoft.com/microsoft-365/roadmap?filters=Microsoft%20Copilot%20(Microsoft%20365)" target="_blank" rel="noopener">Microsoft 365 Roadmap</a>
      and <a href="https://mc.merill.net/" target="_blank" rel="noopener">Message Center Archive</a>.
      Dates are Microsoft's current estimates and can move; Message Center posts vary by tenant, so confirm in your
      <a href="https://admin.microsoft.com/#/MessageCenter" target="_blank" rel="noopener">admin center</a>.
      Refreshed every 6 hours<span id="wfLink"></span>.
    </footer>
  </main>

  <script src="app.js?v=5"></script>
</body>
</html>
