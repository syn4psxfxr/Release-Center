<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copilot Release Center</title>
  <meta name="description" content="Microsoft 365 Copilot updates from the official Microsoft 365 Roadmap and the Message Center.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b5fc7'/><path d='M9 21l5-10 4 7 2-3 3 6' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="wrap top">
    <div>
      <h1>Copilot Release Center</h1>
      <p class="muted">Microsoft 365 Copilot · Roadmap and Message Center</p>
    </div>
    <div class="actions">
      <span id="lastUpdate" class="muted small"></span>
      <button id="btnCheck" class="btn" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Check for updates
      </button>
      <button id="btnTheme" class="btn icon" type="button" aria-label="Toggle theme" title="Toggle theme">◐</button>
    </div>
  </header>

  <main class="wrap">
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="all" class="tab active">All</button>
      <button role="tab" data-tab="roadmap" class="tab">Roadmap <span class="count" id="cRoadmap"></span></button>
      <button role="tab" data-tab="mc" class="tab">Message Center <span class="count" id="cMc"></span></button>
    </nav>

    <section class="filters">
      <input id="q" type="search" placeholder="Search title, description or ID" aria-label="Search">
      <select id="fStatus" aria-label="Status"></select>
      <select id="fProduct" aria-label="Product"></select>
      <select id="fPeriod" aria-label="Period">
        <option value="0">Any time</option>
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last year</option>
      </select>
    </section>

    <div class="bar">
      <span id="resultInfo" class="muted small"></span>
      <span class="bar-actions">
        <label class="check small"><input id="fUnread" type="checkbox"> <span id="unreadLabel">New only</span></label>
        <button id="btnMarkAll" class="link small" type="button">Mark all as read</button>
      </span>
    </div>

    <section id="list" class="list"></section>
    <div class="more-wrap"><button id="btnMore" class="btn" type="button" hidden>Show more</button></div>
  </main>

  <footer class="wrap foot muted small">
    Sources: <a href="https://www.microsoft.com/microsoft-365/roadmap?filters=Microsoft%20Copilot%20(Microsoft%20365)" target="_blank" rel="noopener">Microsoft 365 Roadmap</a>
    and <a href="https://mc.merill.net/" target="_blank" rel="noopener">Message Center Archive</a>.
    Message Center posts vary by tenant; confirm in your <a href="https://admin.microsoft.com/#/MessageCenter" target="_blank" rel="noopener">admin center</a>.
    Data refreshes every 6 hours<span id="wfLink"></span>.
  </footer>

  <script src="app.js"></script>
</body>
</html>
